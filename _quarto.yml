project:
  type: book
  output-dir: docs

book:
  title: "Quantitative Finance Lab"
  author: "Ramtin Asadi"
  chapters:
    - index.qmd
    - overview.qmd
    - notebooks/01_yield_curve_bond_pricing_and_risk.ipynb
    - notebooks/02_portfolio_optimization_MV_models.ipynb
    - notebooks/03_risk_report_engine_and_CAPM.ipynb
    - notebooks/04_BSM_IV_greeks_hedging.ipynb
    - notebooks/05_GARCH_forecasting_VRP.ipynb
    - notebooks/06_portfolio_black_littreman.ipynb
    - notebooks/07_dynamic_hedge_ratios.ipynb
    - notebooks/08_vol_surface_local_vol.ipynb
    - notebooks/09_term_structure_models.ipynb
    - notebooks/10_portfolio_tail_parity_robust.ipynb
    - notebooks/11_stochastic_volatility.ipynb
    - notebooks/12_financial_conditions_index.ipynb
    - notebooks/13_american_option_numerics.ipynb
    - notebooks/14_fourier_option_pricing.ipynb
    - notebooks/15_factor_investing.ipynb
    - notebooks/16_regime_switching_portfolio.ipynb
    - notebooks/17_network_portfolio.ipynb
    - notebooks/18_rough_volatility.ipynb
    - notebooks/19_forecasting_kelly_allocation.ipynb
    - notebooks/20_rl_portfolio_allocation.ipynb
    - notebooks/21_fundamental_analysis.ipynb

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-location: right
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-summary: "Show code"
    code-tools: true
    code-copy: true
    code-overflow: wrap
    fig-responsive: true
    lightbox: true
    include-after-body: code-tools-toggle.html
