name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" --config-settings=cmake.define.quantfinlab_build_cpp=off

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check quantfinlab tests

      - name: Test
        run: pytest

  build:
    name: build source, pure wheel, and native wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine check-wheel-contents

      - name: Build sdist and accelerated wheel
        run: python -m build --outdir dist/accelerated

      - name: Build universal pure-Python wheel
        run: |
          python -m build --wheel --outdir dist/pure \
            --config-setting=wheel.cmake=false \
            --config-setting=wheel.platlib=false \
            --config-setting=wheel.py-api=py3

      - name: Check distributions
        run: |
          python -m twine check dist/accelerated/* dist/pure/*
          check-wheel-contents dist/accelerated/*.whl dist/pure/*.whl
