name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Manual release target. Real PyPI publishing is tag-only."
        type: choice
        required: true
        default: "none"
        options:
          - "none"
          - "testpypi"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: version and tag checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: version
        name: Verify package version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]

          init_text = (root / "quantfinlab" / "__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_text)
          if not match:
              raise SystemExit("quantfinlab.__version__ was not found")
          init_version = match.group(1)
          if init_version != package_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml has {package_version}, "
                  f"quantfinlab.__version__ has {init_version}"
              )

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.rsplit("/", 1)[-1]
              expected = f"v{package_version}"
              if tag != expected:
                  raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")

          print(f"version={package_version}")
          PY

  test:
    name: release tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" --config-settings=cmake.define.quantfinlab_build_cpp=off

      - name: Lint
        if: matrix.python-version == '3.11'
        run: ruff check quantfinlab tests

      - name: Test
        run: pytest

  build-sdist-and-pure-wheel:
    name: build sdist and pure wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine check-wheel-contents

      - name: Build source distribution
        run: python -m build --sdist --outdir dist

      - name: Build universal pure-Python wheel
        run: |
          python -m build --wheel --outdir dist \
            --config-setting=wheel.cmake=false \
            --config-setting=wheel.platlib=false \
            --config-setting=wheel.py-api=py3

      - name: Check sdist and pure wheel
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Smoke test pure wheel
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*py3-none-any.whl
          python - <<'PY'
          import importlib.util

          import quantfinlab
          from quantfinlab._optional import has_cpp_kernels
          from quantfinlab.common import MissingKernelsError
          from quantfinlab.options.american import tree_price

          assert quantfinlab.__version__ == "${{ needs.preflight.outputs.version }}"
          assert importlib.util.find_spec("quantfinlab._kernels") is None
          assert not has_cpp_kernels()
          auto_price = tree_price(100.0, 100.0, 0.03, 0.0, 0.2, 0.5, "put", steps=12, engine="auto")
          numpy_price = tree_price(100.0, 100.0, 0.03, 0.0, 0.2, 0.5, "put", steps=12, engine="numpy")
          assert abs(float(auto_price) - float(numpy_price)) < 1e-10
          try:
              tree_price(100.0, 100.0, 0.03, 0.0, 0.2, 0.5, "put", steps=12, engine="cpp")
          except MissingKernelsError:
              pass
          else:
              raise AssertionError("engine='cpp' unexpectedly succeeded in the pure wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist-pure
          path: dist/*
          if-no-files-found: error

  build-accelerated-wheels:
    name: build accelerated wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_SKIP: "*-win32 *-musllinux_*"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_TEST_COMMAND: >-
            python -c "import importlib; import quantfinlab;
            import quantfinlab._kernels;
            from quantfinlab._optional import has_cpp_kernels;
            assert has_cpp_kernels();
            from quantfinlab.options.american import tree_price;
            auto_price = tree_price(100.0, 100.0, 0.03, 0.0, 0.2, 0.5, 'put', steps=12, engine='auto');
            cpp_price = tree_price(100.0, 100.0, 0.03, 0.0, 0.2, 0.5, 'put', steps=12, engine='cpp');
            assert abs(float(auto_price) - float(cpp_price)) < 1e-10"

      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  check-distributions:
    name: check all distributions
    runs-on: ubuntu-latest
    needs:
      - build-sdist-and-pure-wheel
      - build-accelerated-wheels

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: List distributions
        run: ls -lh dist

      - name: Check distributions
        run: |
          python -m pip install -U twine check-wheel-contents
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: check-distributions
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: check-distributions
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
