[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "pybind11>=2.11.0",
    "numpy>=1.24.0,<2.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "quantfinlab"
version = "0.6.0"
description = "Reusable quantitative finance research library extracted from the Quantitative Finance Lab notebook projects"
readme = "quantfinlab/README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ramtin Asadi", email = "ramtin.asadi01@gmail.com" }]
keywords = [
    "quantitative-finance",
    "options-pricing",
    "portfolio-optimization",
    "risk-management",
    "volatility-modeling",
    "fixed-income",
    "machine-learning",
    "monte-carlo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Core dependencies: Required for basic functionality
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<4.0.0",
    "scipy>=1.10.0,<2.0.0",
    "cvxpy>=1.4.0,<2.0.0",
    "typing-extensions>=4.8.0",
    "scikit-learn>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
speed = [
    "numba>=0.58.0,<0.65.0",
]

numerics = [
    "jax>=0.4.20,<0.5.0",
    "jaxlib>=0.4.20,<0.5.0",
    "numba>=0.58.0,<0.65.0",
]

volatility = [
    "arch>=6.0.0,<7.0.0",
    "statsmodels>=0.14.0,<0.15.0",
]

hedging = [
    "statsmodels>=0.14.0,<0.15.0",
]

ml = [
    "torch>=2.4,<3.0",
]

network = [
    "networkx>=3.2,<4.0",
]

plotting = [
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.13.0,<0.14.0",
]

all = [
    "quantfinlab[numerics]",
    "quantfinlab[volatility]",
    "quantfinlab[hedging]",
    "quantfinlab[ml]",
    "quantfinlab[network]",
    "quantfinlab[plotting]",
]

dev = [
    "black>=23.0.0,<25.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "ruff>=0.6.7,<0.7.0",
    "pytest>=7.4.0,<9.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pre-commit>=3.5.0",
    "pdoc>=14.0.0",
]

notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "nbformat>=5.9.0",
    "hmmlearn>=0.3.0,<0.4.0",
    "lightgbm>=4.0.0,<5.0.0",
    "quarto>=1.4.0",
    "openpyxl>=3.1.0,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "quantfinlab[all]",
]

[project.urls]
Homepage = "https://github.com/ramtin-asadi/Quantitative-Finance-Lab"
Documentation = "https://ramtin-asadi.github.io/Quantitative-Finance-Lab/"
Repository = "https://github.com/ramtin-asadi/Quantitative-Finance-Lab.git"
Issues = "https://github.com/ramtin-asadi/Quantitative-Finance-Lab/issues"

[tool.setuptools]
packages = { find = { where = ["."], include = ["quantfinlab*"] } }
include-package-data = true

[tool.setuptools.package-data]
quantfinlab = [
    "*.pyi",
]

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.define.quantfinlab_build_cpp = "on"
wheel.packages = ["quantfinlab"]

[tool.scikit-build.sdist]
exclude = [
    ".quarto/**",
    "_quarto.yml",
    "build/**",
    "code-tools-toggle.html",
    "dist/**",
    "docs/**",
    "notebooks/**",
    "workspace/**",
    "**/.ipynb_checkpoints/**",
    "**/__pycache__/**",
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.ipynb_checkpoints
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "docs",
    "notebooks",
    ".quarto",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

ignore = [
    "E501",
    "B008",
    "B023",
    "B905",
]

[tool.ruff.lint.isort]
known-first-party = ["quantfinlab"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = [
    "build/",
    "dist/",
    "notebooks/",
]

[[tool.mypy.overrides]]
module = [
    "numba.*",
    "arch.*",
    "cvxpy.*",
]

ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--tb=short",
]

testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "cpp: tests requiring the optional C++ extension",
    "ml: tests requiring optional machine-learning dependencies",
    "numerics: tests requiring optional numerical acceleration dependencies",
    "notebook: tests that validate notebook outputs",
]

[tool.coverage.run]
source = ["quantfinlab"]
omit = [
    "*/tests/*",
    "*/notebooks/*",
    "*/quantfinlab/plotting/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.pdoc]
output-dir = "docs/api"
math = true

[tool.pdoc.render]
show-source = true
